<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RestaurantQR - Admin Dashboard</title>

<link rel="stylesheet" href="style.css">

<style>
:root{
  --green:#168447;
  --green-dark:#0e6334;
  --green2:#eaf7ef;
  --text:#17201a;
  --muted:#68736c;
  --card:#fff;
  --bg:#f5f7f5;
  --border:#e5e9e6;
  --danger:#c73535;
  --orange:#e98a16;
  --blue:#2563eb;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}

.app{
  max-width:850px;
  margin:auto;
  padding-bottom:40px;
}

header{
  background:#fff;
  border-bottom:1px solid var(--border);
  padding:18px 16px;
  position:sticky;
  top:0;
  z-index:20;
  text-align:center;
}

header h1{
  margin:0;
  font-size:23px;
}

header p{
  margin:4px 0 0;
  color:var(--muted);
  font-size:13px;
}

header .small{
  position:absolute;
  right:15px;
  top:18px;
  border:0;
  background:#f1f3f2;
  padding:9px 12px;
  border-radius:10px;
  font-weight:700;
}

main{
  padding:16px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 3px 14px rgba(20,40,25,.04);
}

.card h2{
  margin:0 0 15px;
  font-size:18px;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-top:10px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid var(--border);
  border-radius:12px;
  margin:6px 0 8px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:var(--green);
}

button{
  cursor:pointer;
}

.main-btn{
  width:100%;
  border:0;
  background:var(--green);
  color:#fff;
  padding:13px;
  border-radius:12px;
  font-weight:800;
  font-size:14px;
  margin-top:8px;
}

.main-btn:hover{
  background:var(--green-dark);
}

.message{
  margin-top:10px;
  font-size:13px;
  color:var(--green);
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.stat{
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
  background:#fff;
}

.stat span{
  color:var(--muted);
  font-size:12px;
}

.stat b{
  display:block;
  font-size:23px;
  margin-top:4px;
}

.restaurant-card{
  border:1px solid var(--border);
  border-radius:19px;
  padding:16px;
  margin-top:12px;
  background:#fff;
}

.restaurant-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}

.restaurant-head h3{
  margin:0;
  font-size:18px;
}

.owner-info{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}

.badge{
  display:inline-block;
  padding:6px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
}

.badge.active{
  background:#eaf7ef;
  color:var(--green);
}

.badge.blocked{
  background:#ffeaea;
  color:var(--danger);
}

.badge.pending{
  background:#fff3df;
  color:#a96100;
}

.info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:14px;
}

.info{
  background:#f8faf8;
  border-radius:12px;
  padding:10px;
  font-size:12px;
}

.info strong{
  display:block;
  margin-top:3px;
  font-size:13px;
}

.qr-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:15px;
}

.qr-box{
  border:1px solid var(--border);
  border-radius:16px;
  padding:12px;
  text-align:center;
}

.qr-box h4{
  margin:0 0 8px;
  font-size:14px;
}

.qr-box img{
  width:170px;
  max-width:100%;
  aspect-ratio:1/1;
  display:block;
  margin:auto;
  background:#fff;
}

.qr-actions{
  display:flex;
  gap:6px;
  margin-top:9px;
}

.qr-actions button{
  flex:1;
  border:1px solid var(--border);
  background:#fff;
  padding:8px 5px;
  border-radius:9px;
  font-size:11px;
  font-weight:700;
}

.qr-actions button:hover{
  background:var(--green2);
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:14px;
}

.action-btn{
  border:1px solid var(--border);
  background:#fff;
  padding:10px;
  border-radius:11px;
  font-weight:700;
  font-size:12px;
}

.action-btn.green{
  background:var(--green);
  color:#fff;
  border-color:var(--green);
}

.action-btn.red{
  background:#fff0f0;
  color:var(--danger);
  border-color:#ffd1d1;
}

.action-btn.orange{
  background:#fff5e8;
  color:#a96100;
  border-color:#ffe0b4;
}

.action-btn.blue{
  background:#eff6ff;
  color:var(--blue);
  border-color:#dbeafe;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:25px 10px;
}

.hidden{
  display:none!important;
}

@media(max-width:600px){

  .stats{
    grid-template-columns:1fr 1fr 1fr;
  }

  .qr-grid{
    grid-template-columns:1fr 1fr;
  }

  .qr-box img{
    width:135px;
  }

  .info-grid{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:430px){

  .qr-grid{
    grid-template-columns:1fr;
  }

  .qr-box img{
    width:190px;
  }

  .actions{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="app">

<header>

  <button class="small" type="button" onclick="logout()">
    Logout
  </button>

  <h1>RestaurantQR</h1>
  <p>Admin Dashboard</p>

</header>

<main>

<!-- ADD RESTAURANT -->

<section class="card">

  <h2>➕ Add Restaurant</h2>

  <label>Restaurant Name</label>

  <input
    id="restaurantName"
    type="text"
    placeholder="Restaurant name"
  >

  <label>Owner Name</label>

  <input
    id="ownerName"
    type="text"
    placeholder="Owner name"
  >

  <label>Owner Phone</label>

  <input
    id="ownerPhone"
    type="tel"
    placeholder="Phone number"
  >

  <button
    id="addRestaurantBtn"
    class="main-btn"
    type="button"
    onclick="createRestaurant()"
  >
    Add Restaurant
  </button>

  <div id="restaurantMessage" class="message"></div>

</section>


<!-- OVERVIEW -->

<section class="card">

  <h2>📊 Overview</h2>

  <div class="stats">

    <div class="stat">
      <span>Total</span>
      <b id="totalRestaurants">0</b>
    </div>

    <div class="stat">
      <span>Active</span>
      <b id="activeRestaurants">0</b>
    </div>

    <div class="stat">
      <span>Blocked</span>
      <b id="blockedRestaurants">0</b>
    </div>

  </div>

</section>


<!-- RESTAURANTS -->

<section class="card">

  <h2>🏪 Restaurants</h2>

  <div id="restaurantList">
    Loading restaurants...
  </div>

</section>

</main>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="app.js"></script>


<!-- QR LIBRARY -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


<script>

let restaurants = [];


/* =====================================================
   BASE URL
===================================================== */

const PROJECT_BASE_URL =
  "https://aaryan446.github.io/RestaurantQR";


/* =====================================================
   CREATE RESTAURANT
===================================================== */

async function createRestaurant(){

  if(!checkSupabase()) return;

  const name =
    document
      .getElementById("restaurantName")
      .value
      .trim();

  const ownerName =
    document
      .getElementById("ownerName")
      .value
      .trim();

  const ownerPhone =
    document
      .getElementById("ownerPhone")
      .value
      .trim();

  if(!name){

    showMessage(
      "restaurantMessage",
      "❌ Restaurant name डालें।"
    );

    return;
  }

  const button =
    document.getElementById("addRestaurantBtn");

  button.disabled = true;
  button.textContent = "Creating...";

  try{

    const baseSlug =
      name
        .toLowerCase()
        .replace(/[^a-z0-9]+/g,"-")
        .replace(/^-+|-+$/g,"");

    const slug =
      (baseSlug || "restaurant") +
      "-" +
      Math.random()
        .toString(36)
        .substring(2,8);


    /*
      IMPORTANT:
      owner_qr_token और customer_qr_token
      database में default से automatically बनेंगे।
    */

    const result =
      await db
        .from("restaurants")
        .insert({

          name:name,

          owner_name:
            ownerName || null,

          phone:
            ownerPhone || null,

          slug:slug,

          monthly_price:199,

          subscription_status:"pending",

          is_active:true,

          customer_qr_active:true

        })
        .select("*")
        .single();


    if(result.error){

      throw result.error;

    }


    showMessage(
      "restaurantMessage",
      "✅ Restaurant successfully created."
    );


    document.getElementById(
      "restaurantName"
    ).value="";

    document.getElementById(
      "ownerName"
    ).value="";

    document.getElementById(
      "ownerPhone"
    ).value="";


    await loadRestaurants();

  }

  catch(error){

    console.error(error);

    showMessage(
      "restaurantMessage",
      "❌ " +
      (
        error.message ||
        "Restaurant create नहीं हुआ।"
      )
    );

  }

  finally{

    button.disabled=false;

    button.textContent=
      "Add Restaurant";

  }
}


/* =====================================================
   LOAD RESTAURANTS
===================================================== */

async function loadRestaurants(){

  if(!checkSupabase()) return;

  const container =
    document.getElementById(
      "restaurantList"
    );

  container.innerHTML =
    "Restaurants load हो रहे हैं...";


  try{

    const result =
      await db
        .from("restaurants")
        .select("*")
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(result.error){

      throw result.error;

    }


    restaurants =
      result.data || [];


    renderRestaurants();

    updateStats();

  }

  catch(error){

    console.error(
      "LOAD ERROR:",
      error
    );

    container.innerHTML =
      `
      <div class="empty">
        ❌ Restaurant load नहीं हुआ।<br>
        ${escapeHTML(
          error.message || "Unknown error"
        )}
      </div>
      `;

  }
}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

  const total =
    restaurants.length;

  const active =
    restaurants.filter(
      r => r.is_active === true
    ).length;

  const blocked =
    restaurants.filter(
      r => r.is_active === false
    ).length;


  document.getElementById(
    "totalRestaurants"
  ).textContent=total;

  document.getElementById(
    "activeRestaurants"
  ).textContent=active;

  document.getElementById(
    "blockedRestaurants"
  ).textContent=blocked;
}


/* =====================================================
   RENDER
===================================================== */

function renderRestaurants(){

  const container =
    document.getElementById(
      "restaurantList"
    );


  if(!restaurants.length){

    container.innerHTML =
      `
      <div class="empty">
        अभी कोई restaurant नहीं है।
      </div>
      `;

    return;
  }


  container.innerHTML =
    restaurants
      .map(function(r){

        const active =
          r.is_active === true;

        const customerActive =
          r.customer_qr_active === true;


        const subscription =
          r.subscription_status ||
          "pending";


        const startDate =
          r.subscription_start
            ? new Date(
                r.subscription_start
              ).toLocaleDateString("en-IN")
            : "Not active";


        const endDate =
          r.subscription_end
            ? new Date(
                r.subscription_end
              ).toLocaleDateString("en-IN")
            : "Not active";


        /*
          Actual QR URLs.
          Token user को text में नहीं दिखाया जा रहा।
        */

        const ownerURL =
          PROJECT_BASE_URL +
          "/owner.html?token=" +
          encodeURIComponent(
            r.owner_qr_token || ""
          );


        const customerURL =
          PROJECT_BASE_URL +
          "/customer.html?token=" +
          encodeURIComponent(
            r.customer_qr_token || ""
          );


        return `

        <div class="restaurant-card">

          <div class="restaurant-head">

            <div>

              <h3>
                ${escapeHTML(r.name)}
              </h3>

              <div class="owner-info">
                👤 Owner:
                ${escapeHTML(
                  r.owner_name || "Not added"
                )}
              </div>

              <div class="owner-info">
                📞
                ${escapeHTML(
                  r.phone || "Not added"
                )}
              </div>

            </div>


            <span class="badge ${
              active
                ? "active"
                : "blocked"
            }">

              ${
                active
                  ? "🟢 Active"
                  : "🔴 Blocked"
              }

            </span>

          </div>


          <!-- INFO -->

          <div class="info-grid">

            <div class="info">
              Subscription
              <strong>
                ${escapeHTML(subscription)}
              </strong>
            </div>

            <div class="info">
              Price
              <strong>
                ₹${Number(
                  r.monthly_price || 199
                ).toFixed(0)} / Month
              </strong>
            </div>

            <div class="info">
              Start
              <strong>
                ${startDate}
              </strong>
            </div>

            <div class="info">
              Valid Till
              <strong>
                ${endDate}
              </strong>
            </div>

          </div>


          <!-- QR -->

          <div class="qr-grid">

            <!-- OWNER QR -->

            <div class="qr-box">

              <h4>🔐 Owner QR</h4>

              <div
                id="ownerQR-${r.id}"
              ></div>

              <div class="qr-actions">

                <button
                  type="button"
                  onclick="downloadQR(
                    'ownerQR-${r.id}',
                    '${safeJS(r.name)}-Owner-QR'
                  )"
                >
                  📥 Download
                </button>

                <button
                  type="button"
                  onclick="printQR(
                    'ownerQR-${r.id}',
                    '${safeJS(r.name)} - Owner QR'
                  )"
                >
                  🖨️ Print
                </button>

              </div>

            </div>


            <!-- CUSTOMER QR -->

            <div class="qr-box">

              <h4>📱 Customer QR</h4>

              <div
                id="customerQR-${r.id}"
              ></div>

              <div class="qr-actions">

                <button
                  type="button"
                  onclick="downloadQR(
                    'customerQR-${r.id}',
                    '${safeJS(r.name)}-Customer-QR'
                  )"
                >
                  📥 Download
                </button>

                <button
                  type="button"
                  onclick="printQR(
                    'customerQR-${r.id}',
                    '${safeJS(r.name)} - Customer QR'
                  )"
                >
                  🖨️ Print
                </button>

              </div>

            </div>

          </div>


          <!-- ACTIONS -->

          <div class="actions">

            ${
              active

              ? `
                <button
                  class="action-btn red"
                  type="button"
                  onclick="toggleRestaurant(
                    '${r.id}',
                    false
                  )"
                >
                  🚫 Block Restaurant
                </button>
              `

              : `
                <button
                  class="action-btn green"
                  type="button"
                  onclick="toggleRestaurant(
                    '${r.id}',
                    true
                  )"
                >
                  ✅ Activate Restaurant
                </button>
              `
            }


            ${
              customerActive

              ? `
                <button
                  class="action-btn orange"
                  type="button"
                  onclick="toggleCustomerQR(
                    '${r.id}',
                    false
                  )"
                >
                  📱 Customer QR OFF
                </button>
              `

              : `
                <button
                  class="action-btn blue"
                  type="button"
                  onclick="toggleCustomerQR(
                    '${r.id}',
                    true
                  )"
                >
                  📱 Customer QR ON
                </button>
              `
            }


            <button
              class="action-btn green"
              type="button"
              onclick="activateSubscription(
                '${r.id}'
              )"
            >
              💰 Activate ₹199
            </button>


            <button
              class="action-btn"
              type="button"
              onclick="showRestaurantInfo(
                '${r.id}'
              )"
            >
              ℹ️ Details
            </button>

          </div>

        </div>

        `;

      })
      .join("");


  /*
    QR images render after HTML exists.
  */

  restaurants.forEach(function(r){

    const ownerURL =
      PROJECT_BASE_URL +
      "/owner.html?token=" +
      encodeURIComponent(
        r.owner_qr_token || ""
      );


    const customerURL =
      PROJECT_BASE_URL +
      "/customer.html?token=" +
      encodeURIComponent(
        r.customer_qr_token || ""
      );


    createQR(
      "ownerQR-" + r.id,
      ownerURL
    );


    createQR(
      "customerQR-" + r.id,
      customerURL
    );

  });

}


/* =====================================================
   CREATE QR
===================================================== */

function createQR(elementId,url){

  const element =
    document.getElementById(
      elementId
    );

  if(!element) return;


  element.innerHTML="";


  if(!url || url.endsWith("token=")){

    element.innerHTML =
      `
      <div class="empty">
        QR unavailable
      </div>
      `;

    return;
  }


  new QRCode(element,{

    text:url,

    width:180,

    height:180,

    correctLevel:
      QRCode.CorrectLevel.H

  });

}


/* =====================================================
   DOWNLOAD QR
===================================================== */

function downloadQR(
  elementId,
  fileName
){

  const box =
    document.getElementById(
      elementId
    );

  if(!box){

    alert("QR नहीं मिला।");

    return;
  }


  const canvas =
    box.querySelector("canvas");

  const img =
    box.querySelector("img");


  let dataURL=null;


  if(canvas){

    dataURL =
      canvas.toDataURL(
        "image/png"
      );

  }
  else if(img){

    dataURL =
      img.src;

  }


  if(!dataURL){

    alert("QR image तैयार नहीं है।");

    return;
  }


  const a =
    document.createElement("a");

  a.href=dataURL;

  a.download=
    (fileName || "RestaurantQR") +
    ".png";

  document.body.appendChild(a);

  a.click();

  a.remove();

}


/* =====================================================
   PRINT QR
===================================================== */

function printQR(
  elementId,
  title
){

  const box =
    document.getElementById(
      elementId
    );

  if(!box){

    alert("QR नहीं मिला।");

    return;
  }


  const canvas =
    box.querySelector("canvas");

  const img =
    box.querySelector("img");


  let src="";


  if(canvas){

    src =
      canvas.toDataURL(
        "image/png"
      );
