<!doctype html>
<html lang="hi">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>RestaurantQR Admin</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<div class="app">

    <header>
        <h1>RestaurantQR</h1>
        <p>Admin Login</p>
    </header>

    <main>

        <section class="card">

            <form id="loginForm">

                <input
                    id="email"
                    type="email"
                    placeholder="Admin email"
                    required
                >

                <input
                    id="password"
                    type="password"
                    placeholder="Password"
                    required
                >

                <button
                    type="submit"
                    id="loginBtn"
                >
                    Login
                </button>

            </form>

            <p id="loginMessage"></p>

        </section>

    </main>

</div>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- RestaurantQR Main App -->

<script src="app.js"></script>

</body>
</html>
