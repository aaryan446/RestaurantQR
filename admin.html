<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RestaurantQR - Admin Dashboard</title>

<link rel="stylesheet" href="style.css">

<style>

:root{
  --green:#168447;
  --green-dark:#0e6334;
  --green2:#eaf7ef;
  --text:#17201a;
  --muted:#68736c;
  --card:#fff;
  --bg:#f5f7f5;
  --border:#e5e9e6;
  --danger:#c73535;
  --orange:#e98a16;
  --blue:#2563eb;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}

.app{
  max-width:850px;
  margin:auto;
  padding-bottom:40px;
}

header{
  background:#fff;
  border-bottom:1px solid var(--border);
  padding:18px 16px;
  position:sticky;
  top:0;
  z-index:20;
  text-align:center;
}

header h1{
  margin:0;
  font-size:23px;
}

header p{
  margin:4px 0 0;
  color:var(--muted);
  font-size:13px;
}

header .small{
  position:absolute;
  right:15px;
  top:18px;
  border:0;
  background:#f1f3f2;
  padding:9px 12px;
  border-radius:10px;
  font-weight:700;
}

main{
  padding:16px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 3px 14px rgba(20,40,25,.04);
}

.card h2{
  margin:0 0 15px;
  font-size:18px;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-top:10px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid var(--border);
  border-radius:12px;
  margin:6px 0 8px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:var(--green);
}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.main-btn{
  width:100%;
  border:0;
  background:var(--green);
  color:#fff;
  padding:13px;
  border-radius:12px;
  font-weight:800;
  font-size:14px;
  margin-top:8px;
}

.main-btn:hover{
  background:var(--green-dark);
}

.message{
  margin-top:10px;
  font-size:13px;
}

.message.success{
  color:var(--green);
}

.message.error{
  color:var(--danger);
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.stat{
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
  background:#fff;
}

.stat span{
  color:var(--muted);
  font-size:12px;
}

.stat b{
  display:block;
  font-size:23px;
  margin-top:4px;
}

.restaurant-card{
  border:1px solid var(--border);
  border-radius:19px;
  padding:16px;
  margin-top:12px;
  background:#fff;
}

.restaurant-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}

.restaurant-head h3{
  margin:0;
  font-size:18px;
}

.owner-info{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}

.badge{
  display:inline-block;
  padding:6px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
}

.badge.active{
  background:#eaf7ef;
  color:var(--green);
}

.badge.blocked{
  background:#ffeaea;
  color:var(--danger);
}

.info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:14px;
}

.info{
  background:#f8faf8;
  border-radius:12px;
  padding:10px;
  font-size:12px;
}

.info strong{
  display:block;
  margin-top:3px;
  font-size:13px;
}

.qr-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:15px;
}

.qr-box{
  border:1px solid var(--border);
  border-radius:16px;
  padding:12px;
  text-align:center;
}

.qr-box h4{
  margin:0 0 8px;
  font-size:14px;
}

.qr-image{
  min-height:190px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.qr-image canvas,
.qr-image img{
  width:180px !important;
  height:180px !important;
  display:block;
  background:#fff;
}

.qr-actions{
  display:flex;
  gap:6px;
  margin-top:9px;
}

.qr-actions button{
  flex:1;
  border:1px solid var(--border);
  background:#fff;
  padding:8px 5px;
  border-radius:9px;
  font-size:11px;
  font-weight:700;
}

.qr-actions button:hover{
  background:var(--green2);
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:14px;
}

.action-btn{
  border:1px solid var(--border);
  background:#fff;
  padding:10px;
  border-radius:11px;
  font-weight:700;
  font-size:12px;
}

.action-btn.green{
  background:var(--green);
  color:#fff;
  border-color:var(--green);
}

.action-btn.red{
  background:#fff0f0;
  color:var(--danger);
  border-color:#ffd1d1;
}

.action-btn.orange{
  background:#fff5e8;
  color:#a96100;
  border-color:#ffe0b4;
}

.action-btn.blue{
  background:#eff6ff;
  color:var(--blue);
  border-color:#dbeafe;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:25px 10px;
}

.loading{
  text-align:center;
  color:var(--muted);
  padding:20px;
}

@media(max-width:600px){

  .stats{
    grid-template-columns:1fr 1fr 1fr;
  }

  .qr-grid{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:430px){

  .qr-grid{
    grid-template-columns:1fr;
  }

  .qr-image{
    min-height:205px;
  }

  .qr-image canvas,
  .qr-image img{
    width:190px !important;
    height:190px !important;
  }

  .actions{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<body>

<div class="app">

<header>

  <button
    class="small"
    type="button"
    onclick="logout()"
  >
    Logout
  </button>

  <h1>RestaurantQR</h1>

  <p>Admin Dashboard</p>

</header>


<main>


<!-- =====================================================
     ADD RESTAURANT
===================================================== -->

<section class="card">

  <h2>➕ Add Restaurant</h2>

  <label>
    Restaurant Name
  </label>

  <input
    id="restaurantName"
    type="text"
    placeholder="Restaurant name"
  >


  <label>
    Owner Name
  </label>

  <input
    id="ownerName"
    type="text"
    placeholder="Owner name"
  >


  <label>
    Owner Phone
  </label>

  <input
    id="ownerPhone"
    type="tel"
    placeholder="Phone number"
  >


  <button
    id="addRestaurantBtn"
    class="main-btn"
    type="button"
    onclick="createRestaurant()"
  >
    Add Restaurant
  </button>


  <div
    id="restaurantMessage"
    class="message"
  ></div>

</section>



<!-- =====================================================
     OVERVIEW
===================================================== -->

<section class="card">

  <h2>📊 Overview</h2>

  <div class="stats">

    <div class="stat">

      <span>Total</span>

      <b id="totalRestaurants">
        0
      </b>

    </div>


    <div class="stat">

      <span>Active</span>

      <b id="activeRestaurants">
        0
      </b>

    </div>


    <div class="stat">

      <span>Blocked</span>

      <b id="blockedRestaurants">
        0
      </b>

    </div>

  </div>

</section>



<!-- =====================================================
     RESTAURANTS
===================================================== -->

<section class="card">

  <h2>🏪 Restaurants</h2>

  <div id="restaurantList">

    <div class="loading">
      Loading restaurants...
    </div>

  </div>

</section>


</main>

</div>



<!-- =====================================================
     SUPABASE
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- =====================================================
     MAIN APP
===================================================== -->

<script src="app.js"></script>


<!-- =====================================================
     QR CODE LIBRARY
===================================================== -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>



<script>

"use strict";


/* =====================================================
   VARIABLES
===================================================== */

let restaurants = [];


const PROJECT_BASE_URL =
  "https://aaryan446.github.io/RestaurantQR";


/* =====================================================
   SAFE MESSAGE
===================================================== */

function adminMessage(
  message,
  type=""
){

  const element =
    document.getElementById(
      "restaurantMessage"
    );

  if(!element) return;

  element.textContent =
    message;

  element.className =
    "message " + type;

}


/* =====================================================
   QR URL
===================================================== */

function makeQRURL(
  page,
  token
){

  if(!token){

    return "";

  }

  return (
    PROJECT_BASE_URL +
    "/" +
    page +
    ".html?token=" +
    encodeURIComponent(token)
  );

}


/* =====================================================
   CREATE RESTAURANT
===================================================== */

async function createRestaurant(){

  console.log(
    "createRestaurant() started"
  );


  if(
    typeof checkSupabase !== "function" ||
    !checkSupabase()
  ){

    adminMessage(
      "❌ Supabase connection नहीं है।",
      "error"
    );

    return;

  }


  const name =
    document
      .getElementById(
        "restaurantName"
      )
      .value
      .trim();


  const ownerName =
    document
      .getElementById(
        "ownerName"
      )
      .value
      .trim();


  const ownerPhone =
    document
      .getElementById(
        "ownerPhone"
      )
      .value
      .trim();


  if(!name){

    adminMessage(
      "❌ Restaurant name डालें।",
      "error"
    );

    return;

  }


  const button =
    document.getElementById(
      "addRestaurantBtn"
    );


  button.disabled =
    true;

  button.textContent =
    "Creating...";


  adminMessage(
    "Restaurant create हो रहा है..."
  );


  try{


    /* -------------------------------------------------
       SLUG
    ------------------------------------------------- */

    const baseSlug =
      name
        .toLowerCase()
        .replace(
          /[^a-z0-9]+/g,
          "-"
        )
        .replace(
          /^-+|-+$/g,
          ""
        );


    const slug =
      (
        baseSlug ||
        "restaurant"
      ) +
      "-" +
      Math.random()
        .toString(36)
        .substring(2,8);


    /* -------------------------------------------------
       DATABASE INSERT

       QR TOKEN DATABASE DEFAULT से generate होंगे.
    ------------------------------------------------- */

    const result =
      await db
        .from("restaurants")
        .insert({

          name:
            name,

          owner_name:
            ownerName ||
            null,

          phone:
            ownerPhone ||
            null,

          slug:
            slug,

          monthly_price:
            199,

          subscription_status:
            "pending",

          is_active:
            true,

          customer_qr_active:
            true

        })
        .select("*")
        .single();


    if(result.error){

      throw result.error;

    }


    console.log(
      "Restaurant created:",
      result.data
    );


    adminMessage(
      "✅ Restaurant successfully created.",
      "success"
    );


    /* -------------------------------------------------
       CLEAR FORM
    ------------------------------------------------- */

    document.getElementById(
      "restaurantName"
    ).value = "";


    document.getElementById(
      "ownerName"
    ).value = "";


    document.getElementById(
      "ownerPhone"
    ).value = "";


    /* -------------------------------------------------
       RELOAD
    ------------------------------------------------- */

    await loadRestaurants();


  }
  catch(error){

    console.error(
      "CREATE RESTAURANT ERROR:",
      error
    );


    adminMessage(
      "❌ " +
      (
        error.message ||
        "Restaurant create नहीं हुआ।"
      ),
      "error"
    );

  }
  finally{

    button.disabled =
      false;

    button.textContent =
      "Add Restaurant";

  }

}



/* =====================================================
   LOAD RESTAURANTS
===================================================== */

async function loadRestaurants(){

  const container =
    document.getElementById(
      "restaurantList"
    );


  if(
    typeof checkSupabase !== "function" ||
    !checkSupabase()
  ){

    container.innerHTML =
      `
      <div class="empty">
        ❌ Supabase connection नहीं है।
      </div>
      `;

    return;

  }


  container.innerHTML =
    `
    <div class="loading">
      Restaurants load हो रहे हैं...
    </div>
    `;


  try{


    const result =
      await db
        .from("restaurants")
        .select("*")
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(result.error){

      throw result.error;

    }


    restaurants =
      result.data || [];


    updateStats();

    renderRestaurants();


  }
  catch(error){

    console.error(
      "LOAD RESTAURANTS ERROR:",
      error
    );


    container.innerHTML =
      `
      <div class="empty">

        ❌ Restaurant load नहीं हुआ।

        <br><br>

        ${escapeHTML(
          error.message ||
          "Unknown error"
        )}

      </div>
      `;

  }

}



/* =====================================================
   STATS
===================================================== */

function updateStats(){

  const total =
    restaurants.length;


  const active =
    restaurants.filter(
      function(r){

        return r.is_active === true;

      }
    ).length;


  const blocked =
    restaurants.filter(
      function(r){

        return r.is_active === false;

      }
    ).length;


  document.getElementById(
    "totalRestaurants"
  ).textContent =
    total;


  document.getElementById(
    "activeRestaurants"
  ).textContent =
    active;


  document.getElementById(
    "blockedRestaurants"
  ).textContent =
    blocked;

}



/* =====================================================
   RENDER RESTAURANTS
===================================================== */

function renderRestaurants(){

  const container =
    document.getElementById(
      "restaurantList"
    );


  if(!restaurants.length){

    container.innerHTML =
      `
      <div class="empty">
        अभी कोई restaurant नहीं है।
      </div>
      `;

    return;

  }


  container.innerHTML =
    restaurants
      .map(
        function(r){

          const active =
            r.is_active === true;


          const customerActive =
            r.customer_qr_active === true;


          const subscription =
            r.subscription_status ||
            "pending";


          const startDate =
            r.subscription_start
              ? new Date(
                  r.subscription_start
                ).toLocaleDateString(
                  "en-IN"
                )
              : "Not active";


          const endDate =
            r.subscription_end
              ? new Date(
                  r.subscription_end
                ).toLocaleDateString(
                  "en-IN"
                )
              : "Not active";


          return `

          <div
            class="restaurant-card"
          >


            <!-- HEADER -->

            <div
              class="restaurant-head"
            >

              <div>

                <h3>
                  ${escapeHTML(
                    r.name
                  )}
                </h3>


                <div
                  class="owner-info"
                >
                  👤 Owner:
                  ${escapeHTML(
                    r.owner_name ||
                    "Not added"
                  )}
                </div>


                <div
                  class="owner-info"
                >
                  📞
                  ${escapeHTML(
                    r.phone ||
                    "Not added"
                  )}
                </div>

              </div>


              <span
                class="badge ${
                  active
                    ? "active"
                    : "blocked"
                }"
              >

                ${
                  active
                    ? "🟢 Active"
                    : "🔴 Blocked"
                }

              </span>

            </div>



            <!-- INFO -->

            <div
              class="info-grid"
            >

              <div class="info">

                Subscription

                <strong>
                  ${escapeHTML(
                    subscription
                  )}
                </strong>

              </div>


              <div class="info">

                Price

                <strong>
                  ₹${Number(
                    r.monthly_price ||
                    199
                  ).toFixed(0)}
                  / Month
                </strong>

              </div>


              <div class="info">

                Start

                <strong>
                  ${startDate}
                </strong>

              </div>


              <div class="info">

                Valid Till

                <strong>
                  ${endDate}
                </strong>

              </div>

            </div>



            <!-- QR GRID -->

            <div
              class="qr-grid"
            >


              <!-- OWNER QR -->

              <div
                class="qr-box"
              >

                <h4>
                  🔐 Owner QR
                </h4>


                <div
                  class="qr-image"
                  id="ownerQR-${r.id}"
                >
                  Loading QR...
                </div>


                <div
                  class="qr-actions"
                >

                  <button
                    type="button"
                    onclick="
                      downloadQR(
                        '${r.id}',
                        'owner'
                      )
                    "
                  >
                    📥 Download
                  </button>


                  <button
                    type="button"
                    onclick="
                      printQR(
                        '${r.id}',
                        'owner'
                      )
                    "
                  >
                    🖨️ Print
                  </button>

                </div>

              </div>



              <!-- CUSTOMER QR -->

              <div
                class="qr-box"
              >

                <h4>
                  📱 Customer QR
                </h4>


                <div
                  class="qr-image"
                  id="customerQR-${r.id}"
                >
                  Loading QR...
                </div>


                <div
                  class="qr-actions"
                >

                  <button
                    type="button"
                    onclick="
                      downloadQR(
                        '${r.id}',
                        'customer'
                      )
                    "
                  >
                    📥 Download
                  </button>


                  <button
                    type="button"
                    onclick="
                      printQR(
                        '${r.id}',
                        'customer'
                      )
                    "
                  >
                    🖨️ Print
                  </button>

                </div>

              </div>


            </div>



            <!-- ACTIONS -->

            <div
              class="actions"
            >


              ${
                active

                ?

                `
                <button
                  class="action-btn red"
                  type="button"
                  onclick="
                    toggleRestaurant(
                      '${r.id}',
                      false
                    )
                  "
                >
                  🚫 Block Restaurant
                </button>
                `

                :

                `
                <button
                  class="action-btn green"
                  type="button"
                  onclick="
                    toggleRestaurant(
                      '${r.id}',
                      true
                    )
                  "
                >
                  ✅ Activate Restaurant
                </button>
                `
              }



              ${
                customerActive

                ?

                `
                <button
                  class="action-btn orange"
                  type="button"
                  onclick="
                    toggleCustomerQR(
                      '${r.id}',
                      false
                    )
                  "
                >
                  📱 Customer QR OFF
                </button>
                `

                :

                `
                <button
                  class="action-btn blue"
                  type="button"
                  onclick="
                    toggleCustomerQR(
                      '${r.id}',
                      true
                    )
                  "
                >
                  📱 Customer QR ON
                </button>
                `
              }



              <button
                class="action-btn green"
                type="button"
                onclick="
                  activateSubscription(
                    '${r.id}'
                  )
                "
              >
                💰 Activate ₹199
              </button>



              <button
                class="action-btn"
                type="button"
                onclick="
                  showRestaurantInfo(
                    '${r.id}'
                  )
                "
              >
                ℹ️ Details
              </button>


            </div>


          </div>

          `;

        }
      )
      .join("");


  /* -------------------------------------------------
     CREATE QR AFTER HTML
  ------------------------------------------------- */

  restaurants.forEach(
    function(r){

      createQR(
        "ownerQR-" + r.id,
        makeQRURL(
          "owner",
          r.owner_qr_token
        )
      );


      createQR(
        "customerQR-" + r.id,
        makeQRURL(
          "customer",
          r.customer_qr_token
        )
      );

    }
  );

}



/* =====================================================
   CREATE QR IMAGE
===================================================== */

function createQR(
  elementId,
  url
){

  const element =
    document.getElementById(
      elementId
    );


  if(!element) return;


  element.innerHTML =
    "";


  if(
    typeof QRCode ===
    "undefined"
  ){

    element.innerHTML =
      `
      <div class="empty">
        ❌ QR library load नहीं हुई।
      </div>
      `;

    return;

  }


  if(
    !url ||
    !url.includes(
      "token="
    ) ||
    url.endsWith(
      "token="
    )
  ){

    element.innerHTML =
      `
      <div class="empty">
        ❌ QR token available नहीं है।
      </div>
      `;

    return;

  }


  try{

    new QRCode(
      element,
      {

        text:url,

        width:180,

        height:180,

        correctLevel:
          QRCode.CorrectLevel.H

      }
    );

  }
  catch(error){

    console.error(
      "QR CREATE ERROR:",
      error
    );


    element.innerHTML =
      `
      <div class="empty">
        ❌ QR create नहीं हुआ।
      </div>
      `;

  }

}



/* =====================================================
   GET QR IMAGE
===================================================== */

function getQRSource(
  id,
  type
){

  const elementId =
    type === "owner"
      ? "ownerQR-" + id
      : "customerQR-" + id;


  const box =
    document.getElementById(
      elementId
    );


  if(!box) return null;


  const canvas =
    box.querySelector(
      "canvas"
    );


  if(canvas){

    return canvas.toDataURL(
      "image/png"
    );

  }


  const img =
    box.querySelector(
      "img"
    );


  if(img){

    return img.src;

  }


  return null;

}



/* =====================================================
   DOWNLOAD QR
===================================================== */

function downloadQR(
  id,
  type
){

  const restaurant =
    restaurants.find(
      function(r){

        return r.id === id;

      }
    );


  if(!restaurant){

    alert(
      "Restaurant नहीं मिला।"
    );

    return;

  }


  const src =
    getQRSource(
      id,
      type
    );


  if(!src){

    alert(
      "QR image तैयार नहीं है।"
    );

    return;

  }


  const filename =
    (
      restaurant.name ||
      "Restaurant"
    ) +
    "-" +
    (
      type === "owner"
        ? "Owner-QR"
        : "Customer-QR"
    ) +
    ".png";


  const link =
    document.createElement(
      "a"
    );


  link.href =
    src;

  link.download =
    filename;


  document.body.appendChild(
    link
  );

  link.click();

  link.remove();

}



/* =====================================================
   PRINT QR
===================================================== */

function printQR(
  id,
  type
){

  const restaurant =
    restaurants.find(
      function(r){

        return r.id === id;

      }
    );


  if(!restaurant){

    alert(
      "Restaurant नहीं मिला।"
    );

    return;

  }


  const src =
    getQRSource(
      id,
      type
    );


  if(!src){

    alert(
      "QR image तैयार नहीं है।"
    );

    return;

  }


  const title =
    (
      restaurant.name ||
      "Restaurant"
    ) +
    (
      type === "owner"
        ? " - Owner QR"
        : " - Customer QR"
    );


  const printWindow =
    window.open(
      "",
      "_blank"
    );


  if(!printWindow){

    alert(
      "Popup blocked है। Browser में popup allow करें।"
    );

    return;

  }


  printWindow.document.open();


  printWindow.document.write(`

    <!DOCTYPE html>

    <html>

    <head>

      <title>
        ${escapeHTML(title)}
      </title>

      <style>

        body{
          font-family:Arial,sans-serif;
          text-align:center;
          padding:30px;
        }

        h2{
          margin-bottom:20px;
        }

        img{
          width:300px;
          height:300px;
        }

      </style>

    </head>

    <body>

      <h2>
        ${escapeHTML(title)}
      </h2>

      <img
        src="${src}"
      >

    </body>

    </html>

  `);


  printWindow.document.close();


  setTimeout(
    function(){

      printWindow.focus();

      printWindow.print();

    },
    500
  );

}

/* =====================================================
   ₹199 SUBSCRIPTION
===================================================== */

async function activateSubscription(
  id
){

  if(!checkSupabase()) return;


  const start =
    new Date();


  const end =
    new Date(
      start
    );


  end.setMonth(
    end.getMonth() + 1
  );


  try{

    const {error} =
      await db
        .from("restaurants")
        .update({

          subscription_status:
            "active",

          subscription_start:
            start.toISOString(),

          subscription_end:
            end.toISOString()

        })
        .eq(
          "id",
          id
        );


    if(error){

      throw error;

    }


    alert(
      "✅ ₹199 subscription activated."
    );


    await loadRestaurants();

  }
  catch(error){

    alert(
      "❌ Subscription activate नहीं हुआ:\n" +
      (
        error.message ||
        "Unknown error"
      )
    );

  }

}



/* =====================================================
   DETAILS
===================================================== */

function showRestaurantInfo(
  id
){

  const restaurant =
    restaurants.find(
      function(r){

        return r.id === id;

      }
    );


  if(!restaurant) return;


  const validTill =
    restaurant.subscription_end
      ? new Date(
          restaurant.subscription_end
        ).toLocaleDateString(
          "en-IN"
        )
      : "Not active";


  alert(

    "Restaurant: " +
    (
      restaurant.name ||
      "-"
    ) +

    "\nOwner: " +
    (
      restaurant.owner_name ||
      "-"
    ) +

    "\nPhone: " +
    (
      restaurant.phone ||
      "-"
    ) +

    "\nSubscription: " +
    (
      restaurant.subscription_status ||
      "pending"
    ) +

    "\nValid Till: " +
    validTill

  );

}
