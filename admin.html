<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RestaurantQR - Admin Dashboard</title>

<link rel="stylesheet" href="style.css">

<style>
:root{
  --green:#168447;
  --green-dark:#0e6334;
  --green2:#eaf7ef;
  --text:#17201a;
  --muted:#68736c;
  --card:#fff;
  --bg:#f5f7f5;
  --border:#e5e9e6;
  --danger:#c73535;
  --orange:#e98a16;
  --blue:#2563eb;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}

.app{
  max-width:850px;
  margin:auto;
  padding-bottom:40px;
}

header{
  background:#fff;
  border-bottom:1px solid var(--border);
  padding:18px 16px;
  position:sticky;
  top:0;
  z-index:20;
  text-align:center;
}

header h1{
  margin:0;
  font-size:23px;
}

header p{
  margin:4px 0 0;
  color:var(--muted);
  font-size:13px;
}

header .small{
  position:absolute;
  right:15px;
  top:18px;
  border:0;
  background:#f1f3f2;
  padding:9px 12px;
  border-radius:10px;
  font-weight:700;
}

main{
  padding:16px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 3px 14px rgba(20,40,25,.04);
}

.card h2{
  margin:0 0 15px;
  font-size:18px;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-top:10px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid var(--border);
  border-radius:12px;
  margin:6px 0 8px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:var(--green);
}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.main-btn{
  width:100%;
  border:0;
  background:var(--green);
  color:#fff;
  padding:13px;
  border-radius:12px;
  font-weight:800;
  font-size:14px;
  margin-top:8px;
}

.main-btn:hover{
  background:var(--green-dark);
}

.message{
  margin-top:10px;
  font-size:13px;
}

.message.success{
  color:var(--green);
}

.message.error{
  color:var(--danger);
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.stat{
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
  background:#fff;
  text-align:center;
}

.stat span{
  color:var(--muted);
  font-size:12px;
}

.stat b{
  display:block;
  font-size:23px;
  margin-top:4px;
}

.restaurant-card{
  border:1px solid var(--border);
  border-radius:19px;
  padding:16px;
  margin-top:12px;
  background:#fff;
}

.restaurant-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}

.restaurant-head h3{
  margin:0;
  font-size:18px;
}

.owner-info{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}

.badge{
  display:inline-block;
  padding:6px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
}

.badge.active{
  background:#eaf7ef;
  color:var(--green);
}

.badge.blocked{
  background:#ffeaea;
  color:var(--danger);
}

.badge.pending{
  background:#fff3df;
  color:#a96100;
}

.info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:14px;
}

.info{
  background:#f8faf8;
  border-radius:12px;
  padding:10px;
  font-size:12px;
}

.info strong{
  display:block;
  margin-top:3px;
  font-size:13px;
}

.qr-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:15px;
}

.qr-box{
  border:1px solid var(--border);
  border-radius:16px;
  padding:12px;
  text-align:center;
}

.qr-box h4{
  margin:0 0 8px;
  font-size:14px;
}

.qr-image{
  width:180px;
  height:180px;
  max-width:100%;
  margin:auto;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#fff;
}

.qr-image canvas,
.qr-image img{
  width:180px !important;
  height:180px !important;
  max-width:100%;
}

.qr-actions{
  display:flex;
  gap:6px;
  margin-top:9px;
}

.qr-actions button{
  flex:1;
  border:1px solid var(--border);
  background:#fff;
  padding:8px 5px;
  border-radius:9px;
  font-size:11px;
  font-weight:700;
}

.qr-actions button:hover{
  background:var(--green2);
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:14px;
}

.action-btn{
  border:1px solid var(--border);
  background:#fff;
  padding:10px;
  border-radius:11px;
  font-weight:700;
  font-size:12px;
}

.action-btn.green{
  background:var(--green);
  color:#fff;
  border-color:var(--green);
}

.action-btn.red{
  background:#fff0f0;
  color:var(--danger);
  border-color:#ffd1d1;
}

.action-btn.orange{
  background:#fff5e8;
  color:#a96100;
  border-color:#ffe0b4;
}

.action-btn.blue{
  background:#eff6ff;
  color:var(--blue);
  border-color:#dbeafe;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:25px 10px;
}

.loading{
  text-align:center;
  color:var(--muted);
  padding:20px;
}

@media(max-width:600px){

  main{
    padding:12px;
  }

  .stats{
    grid-template-columns:1fr 1fr 1fr;
  }

  .qr-grid{
    grid-template-columns:1fr;
  }

  .actions{
    grid-template-columns:1fr;
  }

}

@media(max-width:380px){

  .stats{
    gap:6px;
  }

  .stat{
    padding:10px 5px;
  }

  .stat b{
    font-size:20px;
  }

}
</style>
</head>

<body>

<div class="app">

<header>

  <button
    class="small"
    type="button"
    onclick="logout()">
    Logout
  </button>

  <h1>RestaurantQR</h1>
  <p>Admin Dashboard</p>

</header>


<main>

<!-- ================= ADD RESTAURANT ================= -->

<section class="card">

  <h2>➕ Add Restaurant</h2>

  <label>Restaurant Name</label>

  <input
    id="restaurantName"
    type="text"
    placeholder="Restaurant name"
    autocomplete="off"
  >

  <label>Owner Name</label>

  <input
    id="ownerName"
    type="text"
    placeholder="Owner name"
    autocomplete="off"
  >

  <label>Owner Phone</label>

  <input
    id="ownerPhone"
    type="tel"
    placeholder="Phone number"
    inputmode="numeric"
    autocomplete="off"
  >

  <button
    id="addRestaurantBtn"
    class="main-btn"
    type="button"
    onclick="createRestaurant()">

    Add Restaurant

  </button>

  <div
    id="restaurantMessage"
    class="message">
  </div>

</section>


<!-- ================= OVERVIEW ================= -->

<section class="card">

  <h2>📊 Overview</h2>

  <div class="stats">

    <div class="stat">
      <span>Total</span>
      <b id="totalRestaurants">0</b>
    </div>

    <div class="stat">
      <span>Active</span>
      <b id="activeRestaurants">0</b>
    </div>

    <div class="stat">
      <span>Blocked</span>
      <b id="blockedRestaurants">0</b>
    </div>

  </div>

</section>


<!-- ================= RESTAURANTS ================= -->

<section class="card">

  <h2>🏪 Restaurants</h2>

  <div id="restaurantList">
    <div class="loading">
      Loading restaurants...
    </div>
  </div>

</section>

</main>

</div>


<!-- ================= SUPABASE ================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="app.js"></script>


<!-- ================= QR LIBRARY ================= -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


<script>

/* =====================================================
   GLOBAL
===================================================== */

let restaurants = [];


/* =====================================================
   PROJECT URL
===================================================== */

const PROJECT_BASE_URL =
  "https://aaryan446.github.io/RestaurantQR";


/* =====================================================
   SAFE TEXT
===================================================== */

function safeText(value){

  return String(value ?? "");

}


/* =====================================================
   JS SAFE STRING
===================================================== */

function safeJS(value){

  return safeText(value)
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/"/g,'\\"')
    .replace(/\n/g," ")
    .replace(/\r/g," ");

}


/* =====================================================
   MESSAGE
===================================================== */

function adminMessage(text,type=""){

  const box =
    document.getElementById(
      "restaurantMessage"
    );

  if(!box) return;

  box.textContent = text;

  box.className =
    "message " + type;

}


/* =====================================================
   TOKEN GENERATOR
===================================================== */

function generateToken(prefix){

  if(
    window.crypto &&
    typeof crypto.randomUUID === "function"
  ){

    return prefix + "_" +
      crypto
        .randomUUID()
        .replace(/-/g,"");

  }

  return prefix + "_" +
    Date.now().toString(36) +
    "_" +
    Math.random()
      .toString(36)
      .substring(2,14);

}


/* =====================================================
   CREATE RESTAURANT
===================================================== */

async function createRestaurant(){

  if(!checkSupabase()) return;


  const name =
    document
      .getElementById("restaurantName")
      .value
      .trim();


  const ownerName =
    document
      .getElementById("ownerName")
      .value
      .trim();


  const ownerPhone =
    document
      .getElementById("ownerPhone")
      .value
      .trim();


  if(!name){

    adminMessage(
      "❌ Restaurant name डालें।",
      "error"
    );

    return;
  }


  const button =
    document.getElementById(
      "addRestaurantBtn"
    );


  button.disabled = true;

  button.textContent =
    "Creating...";


  adminMessage("");


  try{

    const baseSlug =
      name
        .toLowerCase()
        .replace(/[^a-z0-9]+/g,"-")
        .replace(/^-+|-+$/g,"");


    const slug =
      (baseSlug || "restaurant") +
      "-" +
      Math.random()
        .toString(36)
        .substring(2,8);


    /*
      IMPORTANT:
      हर restaurant के लिए
      नया Owner QR token
      और Customer QR token बनेगा।
      
      Token user को dashboard में
      text के रूप में नहीं दिखाया जाएगा।
    */

    const ownerToken =
      generateToken("owner");


    const customerToken =
      generateToken("customer");


    const result =
      await db
        .from("restaurants")
        .insert({

          name:name,

          owner_name:
            ownerName || null,

          phone:
            ownerPhone || null,

          slug:slug,

          monthly_price:199,

          subscription_status:
            "pending",

          is_active:true,

          customer_qr_active:true,

          owner_qr_token:
            ownerToken,

          customer_qr_token:
            customerToken

        })
        .select("*")
        .single();


    if(result.error){

      throw result.error;

    }


    adminMessage(
      "✅ Restaurant successfully created.",
      "success"
    );


    document.getElementById(
      "restaurantName"
    ).value = "";


    document.getElementById(
      "ownerName"
    ).value = "";


    document.getElementById(
      "ownerPhone"
    ).value = "";


    await loadRestaurants();


  }catch(error){

    console.error(
      "CREATE RESTAURANT ERROR:",
      error
    );


    adminMessage(
      "❌ " +
      (
        error.message ||
        "Restaurant create नहीं हुआ।"
      ),
      "error"
    );


  }finally{

    button.disabled = false;

    button.textContent =
      "Add Restaurant";

  }

}


/* =====================================================
   LOAD RESTAURANTS
===================================================== */

async function loadRestaurants(){

  if(!checkSupabase()) return;


  const container =
    document.getElementById(
      "restaurantList"
    );


  container.innerHTML =
    '<div class="loading">Restaurants load हो रहे हैं...</div>';


  try{

    const result =
      await db
        .from("restaurants")
        .select("*")
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(result.error){

      throw result.error;

    }


    restaurants =
      result.data || [];


    renderRestaurants();

    updateStats();


  }catch(error){

    console.error(
      "LOAD RESTAURANTS ERROR:",
      error
    );


    container.innerHTML = `

      <div class="empty">

        ❌ Restaurant load नहीं हुआ।<br><br>

        ${escapeHTML(
          error.message ||
          "Unknown error"
        )}

      </div>

    `;

  }

}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

  const total =
    restaurants.length;


  const active =
    restaurants.filter(
      r => r.is_active === true
    ).length;


  const blocked =
    restaurants.filter(
      r => r.is_active === false
    ).length;


  document.getElementById(
    "totalRestaurants"
  ).textContent = total;


  document.getElementById(
    "activeRestaurants"
  ).textContent = active;


  document.getElementById(
    "blockedRestaurants"
  ).textContent = blocked;

}


/* =====================================================
   RENDER RESTAURANTS
===================================================== */

function renderRestaurants(){

  const container =
    document.getElementById(
      "restaurantList"
    );


  if(!restaurants.length){

    container.innerHTML = `

      <div class="empty">

        अभी कोई restaurant नहीं है।

      </div>

    `;

    return;
  }


  container.innerHTML =
    restaurants.map(function(r){

      const active =
        r.is_active === true;


      const customerActive =
        r.customer_qr_active === true;


      const subscription =
        r.subscription_status ||
        "pending";


      const startDate =
        r.subscription_start
          ? new Date(
              r.subscription_start
            ).toLocaleDateString("en-IN")
          : "Not active";


      const endDate =
        r.subscription_end
          ? new Date(
              r.subscription_end
            ).toLocaleDateString("en-IN")
          : "Not active";


      /*
        QR LINK
      */

      const ownerURL =
        PROJECT_BASE_URL +
        "/owner.html?token=" +
        encodeURIComponent(
          r.owner_qr_token || ""
        );


      const customerURL =
        PROJECT_BASE_URL +
        "/customer.html?token=" +
        encodeURIComponent(
          r.customer_qr_token || ""
        );


      return `

      <div class="restaurant-card">

        <!-- HEADER -->

        <div class="restaurant-head">

          <div>

            <h3>
              ${escapeHTML(
                r.name || "Restaurant"
              )}
            </h3>

            <div class="owner-info">
              👤 Owner:
              ${escapeHTML(
                r.owner_name ||
                "Not added"
              )}
            </div>

            <div class="owner-info">
              📞
              ${escapeHTML(
                r.phone ||
                "Not added"
              )}
            </div>

          </div>


          <span class="badge ${
            active
              ? "active"
              : "blocked"
          }">

            ${
              active
                ? "🟢 Active"
                : "🔴 Blocked"
            }

          </span>

        </div>


        <!-- INFORMATION -->

        <div class="info-grid">

          <div class="info">

            Subscription

            <strong>
              ${escapeHTML(
                subscription
              )}
            </strong>

          </div>


          <div class="info">

            Price

            <strong>
              ₹${Number(
                r.monthly_price || 199
              ).toFixed(0)}
              / Month
            </strong>

          </div>


          <div class="info">

            Start

            <strong>
              ${startDate}
            </strong>

          </div>


          <div class="info">

            Valid Till

            <strong>
              ${endDate}
            </strong>

          </div>

        </div>


        <!-- ================= QR ================= -->

        <div class="qr-grid">


          <!-- OWNER QR -->

          <div class="qr-box">

            <h4>
              🔐 Owner QR
            </h4>

            <div
              class="qr-image"
              id="ownerQR-${safeJS(r.id)}">
            </div>

            <div class="qr-actions">

              <button
                type="button"
                onclick="downloadQR(
                  '${safeJS(r.id)}',
                  'owner',
                  '${safeJS(r.name)}'
                )">

                📥 Download

              </button>


              <button
                type="button"
                onclick="printQR(
                  '${safeJS(r.id)}',
                  'owner',
                  '${safeJS(r.name)}'
                )">

                🖨️ Print

              </button>

            </div>

          </div>


          <!-- CUSTOMER QR -->

          <div class="qr-box">

            <h4>
              📱 Customer QR
            </h4>

            <div
              class="qr-image"
              id="customerQR-${safeJS(r.id)}">
            </div>

            <div class="qr-actions">

              <button
                type="button"
                onclick="downloadQR(
                  '${safeJS(r.id)}',
                  'customer',
                  '${safeJS(r.name)}'
                )">

                📥 Download

              </button>


              <button
                type="button"
                onclick="printQR(
                  '${safeJS(r.id)}',
                  'customer',
                  '${safeJS(r.name)}'
                )">

                🖨️ Print

              </button>

            </div>

          </div>

        </div>


        <!-- ================= ACTIONS ================= -->

        <div class="actions">


          ${
            active

              ? `

                <button
                  class="action-btn red"
                  type="button"
                  onclick="toggleRestaurant(
                    '${safeJS(r.id)}',
                    false
                  )">

                  🚫 Block Restaurant

                </button>

              `

              : `

                <button
                  class="action-btn green"
                  type="button"
                  onclick="toggleRestaurant(
                    '${safeJS(r.id)}',
                    true
                  )">

                  ✅ Activate Restaurant

                </button>

              `
          }


          ${
            customerActive

              ? `

                <button
                  class="action-btn orange"
                  type="button"
                  onclick="toggleCustomerQR(
                    '${safeJS(r.id)}',
                    false
                  )">

                  📱 Customer QR OFF

                </button>

              `

              : `

                <button
                  class="action-btn blue"
                  type="button"
                  onclick="toggleCustomerQR(
                    '${safeJS(r.id)}',
                    true
                  )">

                  📱 Customer QR ON

                </button>

              `
          }


          <button
            class="action-btn green"
            type="button"
            onclick="activateSubscription(
              '${safeJS(r.id)}'
            )">

            💰 Activate ₹199

          </button>


          <button
            class="action-btn"
            type="button"
            onclick="showRestaurantInfo(
              '${safeJS(r.id)}'
            )">

            ℹ️ Details

          </button>


        </div>

      </div>

      `;

    }).join("");


  /*
    HTML बनने के बाद QR बनाओ
  */

  restaurants.forEach(function(r){

    const ownerURL =
      PROJECT_BASE_URL +
      "/owner.html?token=" +
      encodeURIComponent(
        r.owner_qr_token || ""
      );


    const customerURL =
      PROJECT_BASE_URL +
      "/customer.html?token=" +
      encodeURIComponent(
        r.customer_qr_token || ""
      );


    createQR(
      "ownerQR-" + r.id,
      ownerURL
    );


    createQR(
      "customerQR-" + r.id,
      customerURL
    );

  });

}


/* =====================================================
   CREATE QR
===================================================== */

function createQR(
  elementId,
  url
){

  const element =
    document.getElementById(
      elementId
    );


  if(!element) return;


  element.innerHTML = "";


  if(
    !url ||
    !url.includes("token=") ||
    url.endsWith("token=")
  ){

    element.innerHTML =
      '<div class="empty">QR unavailable</div>';

    return;

  }


  if(
    typeof QRCode === "undefined"
  ){

    element.innerHTML =
      '<div class="empty">QR library load नहीं हुई।</div>';

    return;

  }


  try{

    new QRCode(
      element,
      {
        text:url,
        width:180,
        height:180,
        correctLevel:
          QRCode.CorrectLevel.H
      }
    );

  }catch(error){

    console.error(
      "QR CREATE ERROR:",
      error
    );

    element.innerHTML =
      '<div class="empty">QR create error</div>';

  }

}


/* =====================================================
   GET QR IMAGE
===================================================== */

function getQRDataURL(
  elementId
){

  const box =
    document.getElementById(
      elementId
    );


  if(!box) return null;


  const canvas =
    box.querySelector("canvas");


  if(canvas){

    return canvas.toDataURL(
      "image/png"
    );

  }


  const img =
    box.querySelector("img");


  if(img && img.src){

    return img.src;

  }


  return null;

}


/* =====================================================
   DOWNLOAD QR
===================================================== */

function downloadQR(
  restaurantId,
  type,
  restaurantName
){

  const elementId =
    type === "owner"
      ? "ownerQR-" + restaurantId
      : "customerQR-" + restaurantId;


  const dataURL =
    getQRDataURL(
      elementId
    );


  if(!dataURL){

    alert(
      "❌ QR image तैयार नहीं है।"
    );

    return;

  }


  const a =
    document.createElement("a");


  a.href =
    dataURL;


  const cleanName =
    safeText(
      restaurantName ||
      "Restaurant"
    )
      .replace(
        /[^a-zA-Z0-9_-]/g,
        "_"
      );


  a.download =
    cleanName +
    "-" +
    type +
    "-QR.png";


  document.body.appendChild(a);

  a.click();

  a.remove();

}


/* =====================================================
   PRINT QR
===================================================== */

function printQR(
  restaurantId,
  type,
  restaurantName
){

  const elementId =
    type === "owner"
      ? "ownerQR-" + restaurantId
      : "customerQR-" + restaurantId;


  const dataURL =
    getQRDataURL(
      elementId
    );


  if(!dataURL){

    alert(
      "❌ QR image तैयार नहीं है।"
    );

    return;

  }


  const printWindow =
    window.open(
      "",
      "_blank",
      "width=600,height=700"
    );


  if(!printWindow){

    alert(
      "Popup blocked है। Browser में popup allow करें।"
    );

    return;

  }


  const title =
    safeText(
      restaurantName ||
      "Restaurant QR"
    );


  const qrType =
    type === "owner"
      ? "Owner QR"
      : "Customer QR";


  printWindow.document.open();


  printWindow.document.write(`

    <!DOCTYPE html>

    <html>

    <head>

      <meta charset="UTF-8">

      <title>
        ${escapeHTML(title)}
        - ${qrType}
      </title>

      <style>

        body{
          margin:0;
          padding:40px 20px;
          text-align:center;
          font-family:Arial,sans-serif;
          background:#fff;
        }

        h1{
          font-size:26px;
          margin:0 0 8px;
        }

        h2{
          font-size:19px;
          margin:0 0 25px;
        }

        img{
          width:300px;
          height:300px;
          display:block;
          margin:20px auto;
        }

        .note{
          margin-top:20px;
          font-size:14px;
          color:#555;
        }

        @media print{

          body{
            padding:20px;
          }

          img{
            width:280px;
            height:280px;
          }

        }

      </style>

    </head>

    <body>

      <h1>
        RestaurantQR
      </h1>

      <h2>
        ${escapeHTML(title)}
        <br>
        ${qrType}
      </h2>

      <img
        src="${dataURL}"
        alt="QR Code"
      >

      <div class="note">
        Scan QR to continue
      </div>

      <script>

        window.onload=function(){

          setTimeout(function(){

            window.print();

          },500);

        };

      <\/script>

    </body>

    </html>

  `);


  printWindow.document.close();

}


/* =====================================================
   BLOCK / ACTIVATE RESTAURANT
===================================================== */

async function toggleRestaurant(
  id,
  active
){

  if(!checkSupabase()) return;


  const action =
    active
      ? "activate"
      : "block";


  if(
    !confirm(
      active
        ? "Restaurant activate करना है?"
        : "Restaurant block करना है?"
    )
  ){

    return;

  }


  try{

    const result =
      await db
        .from("restaurants")
        .update({
          is_active:active
        })
        .eq("id",id);


    if(result.error){

      throw result.error;

    }


    await loadRestaurants();


  }catch(error){

    alert(
      "❌ " +
      action +
      " नहीं हुआ:\n" +
      (
        error.message ||
        "Unknown error"
      )
    );

  }

}

/* =====================================================
   ACTIVATE SUBSCRIPTION
===================================================== */

async function activateSubscription(
  id
){

  if(!checkSupabase()) return;


  if(
    !confirm(
      "₹199 की 1 महीने की subscription activate करें?"
    )
  ){

    return;

  }


  try{

    const start =
      new Date();


    const end =
      new Date();


    end.setMonth(
      end.getMonth() + 1
    );


    const result =
      await db
        .from("restaurants")
        .update({

          subscription_status:
            "active",

          subscription_start:
            start.toISOString(),

          subscription_end:
            end.toISOString(),

          is_active:true,

          customer_qr_active:true

        })
        .eq("id",id);


    if(result.error){

      throw result.error;

    }


    alert(
      "✅ Subscription 1 महीने के लिए activate हो गई।"
    );


    await loadRestaurants();


  }catch(error){

    alert(
      "❌ Subscription activate नहीं हुई:\n" +
      (
        error.message ||
        "Unknown error"
      )
    );

  }

}


/* =====================================================
   RESTAURANT DETAILS
===================================================== */

function showRestaurantInfo(
  id
){

  const r =
    restaurants.find(
      x => x.id === id
    );


  if(!r) return;


  const subscription =
    r.subscription_status ||
    "pending";


  alert(

    "Restaurant Details\n\n" +

    "Restaurant: " +
    (r.name || "-") +

    "\nOwner: " +
    (r.owner_name || "-") +

    "\nPhone: " +
    (r.phone || "-") +

    "\nSubscription: " +
    subscription +

    "\nPrice: ₹" +
    Number(
      r.monthly_price || 199
    ).toFixed(0) +

    " / Month" +

    "\nRestaurant: " +
    (
      r.is_active
        ? "Active"
        : "Blocked"
    ) +

    "\nCustomer QR: " +
    (
      r.customer_qr_active
        ? "ON"
        : "OFF"
    )

  );

}
