<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RestaurantQR - Admin</title>

<style>
:root{
  --green:#168447;
  --green2:#eaf7ef;
  --text:#17201a;
  --muted:#68736c;
  --bg:#f5f7f5;
  --card:#fff;
  --border:#e5e9e6;
  --red:#c73535;
  --orange:#e98a16;
  --blue:#2563eb;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}

.app{
  max-width:900px;
  margin:auto;
  padding-bottom:40px;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:#fff;
  border-bottom:1px solid var(--border);
  padding:15px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:22px;
}

header p{
  margin:3px 0 0;
  color:var(--muted);
  font-size:13px;
}

.logout{
  position:absolute;
  right:12px;
  top:13px;
  border:0;
  background:#f1f3f2;
  padding:9px 12px;
  border-radius:10px;
  font-weight:700;
}

main{
  padding:14px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:17px;
  margin-bottom:14px;
  box-shadow:0 3px 14px rgba(20,40,25,.04);
}

h2{
  margin:0 0 14px;
  font-size:18px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid var(--border);
  border-radius:12px;
  margin:5px 0 10px;
  font-size:15px;
  outline:none;
}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.main{
  width:100%;
  padding:13px;
  border:0;
  border-radius:12px;
  background:var(--green);
  color:white;
  font-weight:800;
}

.message{
  margin-top:9px;
  font-size:13px;
}

.success{color:var(--green)}
.error{color:var(--red)}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.stat{
  border:1px solid var(--border);
  border-radius:15px;
  padding:12px 7px;
  text-align:center;
}

.stat span{
  color:var(--muted);
  font-size:11px;
}

.stat b{
  display:block;
  font-size:22px;
  margin-top:3px;
}

.search{
  margin-bottom:5px;
}

.restaurant{
  border:1px solid var(--border);
  border-radius:18px;
  padding:15px;
  margin-top:12px;
}

.head{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.head h3{
  margin:0;
  font-size:17px;
}

.muted{
  color:var(--muted);
  font-size:12px;
}

.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
}

.active{
  background:var(--green2);
  color:var(--green);
}

.blocked{
  background:#ffeaea;
  color:var(--red);
}

.pending{
  background:#fff3df;
  color:#a96100;
}

.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:12px;
}

.info div{
  background:#f8faf8;
  padding:9px;
  border-radius:11px;
  font-size:11px;
}

.info strong{
  display:block;
  font-size:13px;
  margin-top:2px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:12px;
}

.action{
  border:1px solid var(--border);
  background:white;
  padding:10px;
  border-radius:10px;
  font-weight:700;
  font-size:12px;
}

.green{
  background:var(--green);
  color:white;
  border-color:var(--green);
}

.red{
  background:#fff0f0;
  color:var(--red);
}

.orange{
  background:#fff5e8;
  color:#a96100;
}

.blue{
  background:#eff6ff;
  color:var(--blue);
}

.qrgrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:13px;
}

.qrbox{
  border:1px solid var(--border);
  border-radius:15px;
  padding:10px;
  text-align:center;
}

.qrbox h4{
  margin:0 0 8px;
}

.qr{
  min-height:180px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.qr img,
.qr canvas{
  max-width:180px;
  width:180px!important;
  height:180px!important;
}

.qrbuttons{
  display:flex;
  gap:5px;
  margin-top:7px;
}

.qrbuttons button{
  flex:1;
  border:1px solid var(--border);
  background:white;
  border-radius:9px;
  padding:8px;
  font-size:11px;
  font-weight:700;
}

.recharge{
  border:2px solid #ffe0b4;
  background:#fffaf2;
  border-radius:16px;
  padding:14px;
  margin-top:12px;
}

.recharge h3{
  margin:0;
  font-size:15px;
}

.payment-box{
  display:none;
  text-align:center;
  margin-top:12px;
  padding:14px;
  border:1px solid var(--border);
  border-radius:15px;
  background:#fff;
}

.payment-box img{
  width:240px;
  max-width:100%;
  border-radius:12px;
}

.payment-box p{
  font-size:12px;
  color:var(--muted);
}

.empty{
  text-align:center;
  padding:20px;
  color:var(--muted);
}

@media(max-width:600px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .qrgrid{
    grid-template-columns:1fr;
  }

  .actions{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <button class="logout" onclick="logout()">Logout</button>
  <h1>RestaurantQR</h1>
  <p>Admin Dashboard</p>
</header>

<main>

<!-- ADD RESTAURANT -->

<section class="card">

<h2>➕ Add Restaurant</h2>

<input id="restaurantName"
       placeholder="Restaurant Name">

<input id="ownerName"
       placeholder="Owner Name">

<input id="ownerPhone"
       type="tel"
       placeholder="Owner Phone">

<button class="main"
        id="addBtn"
        onclick="createRestaurant()">
Add Restaurant
</button>

<div id="addMessage" class="message"></div>

</section>


<!-- STATS -->

<section class="card">

<h2>📊 Overview</h2>

<div class="stats">

<div class="stat">
<span>Total</span>
<b id="total">0</b>
</div>

<div class="stat">
<span>Active</span>
<b id="active">0</b>
</div>

<div class="stat">
<span>Blocked</span>
<b id="blocked">0</b>
</div>

<div class="stat">
<span>Recharge</span>
<b id="pendingRecharge">0</b>
</div>

</div>

</section>


<!-- RECHARGE REQUESTS -->

<section class="card">

<h2>💰 Recharge Requests</h2>

<div id="rechargeList">
<div class="empty">Loading...</div>
</div>

</section>


<!-- PAYMENT SCANNER -->

<section class="card">

<h2>📲 Admin Payment Scanner</h2>

<p class="muted">
Owner के Recharge पर यही QR दिखाया जा सकता है।
</p>

<div class="payment-box"
     style="display:block">

<img src="payment-qr.png"
     alt="Payment QR">

<p>
₹199 / 1 Month
</p>

</div>

</section>


<!-- RESTAURANTS -->

<section class="card">

<h2>🏪 Restaurants</h2>

<input
  id="search"
  class="search"
  placeholder="🔎 Restaurant या Owner search करें..."
  oninput="renderRestaurants()">

<div id="restaurantList">
<div class="empty">Loading...</div>
</div>

</section>

</main>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="app.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


<script>

let restaurants=[];
let rechargeRequests=[];

const BASE_URL =
"https://aaryan446.github.io/RestaurantQR";


/* =====================================================
   TOKEN
===================================================== */

function token(prefix){

  if(window.crypto &&
     crypto.randomUUID){

    return prefix+"_"+crypto
      .randomUUID()
      .replace(/-/g,"");
  }

  return prefix+"_"+Date.now()+"_"+Math.random()
    .toString(36)
    .substring(2,12);
}


/* =====================================================
   MESSAGE
===================================================== */

function message(id,text,type=""){

  const el=document.getElementById(id);

  if(!el)return;

  el.textContent=text;

  el.className="message "+type;
}


/* =====================================================
   CREATE RESTAURANT
===================================================== */

async function createRestaurant(){

  if(!checkSupabase())return;

  const name=
    document.getElementById("restaurantName")
    .value.trim();

  const owner=
    document.getElementById("ownerName")
    .value.trim();

  const phone=
    document.getElementById("ownerPhone")
    .value.trim();

  if(!name){

    message(
      "addMessage",
      "❌ Restaurant name डालें",
      "error"
    );

    return;
  }

  const btn=
    document.getElementById("addBtn");

  btn.disabled=true;
  btn.textContent="Creating...";

  try{

    const slug=
      (name.toLowerCase()
      .replace(/[^a-z0-9]+/g,"-")
      .replace(/^-+|-+$/g,"")
      ||"restaurant")
      +"-"+
      Math.random()
      .toString(36)
      .substring(2,7);

    const ownerToken=
      token("owner");

    const customerToken=
      token("customer");

    const {data,error}=
      await db
      .from("restaurants")
      .insert({

        name:name,

        owner_name:
          owner || null,

        phone:
          phone || null,

        slug:slug,

        monthly_price:199,

        subscription_status:"pending",

        is_active:true,

        customer_qr_active:true,

        owner_qr_token:
          ownerToken,

        customer_qr_token:
          customerToken

      })
      .select("*")
      .single();

    if(error)throw error;

    message(
      "addMessage",
      "✅ Restaurant successfully added",
      "success"
    );

    document.getElementById(
      "restaurantName"
    ).value="";

    document.getElementById(
      "ownerName"
    ).value="";

    document.getElementById(
      "ownerPhone"
    ).value="";

    await loadAll();

  }catch(e){

    console.error(e);

    message(
      "addMessage",
      "❌ "+e.message,
      "error"
    );

  }finally{

    btn.disabled=false;
    btn.textContent="Add Restaurant";
  }
}


/* =====================================================
   LOAD RESTAURANTS
===================================================== */

async function loadRestaurants(){

  const {data,error}=
    await db
    .from("restaurants")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){

    document.getElementById(
      "restaurantList"
    ).innerHTML=
      `<div class="empty error">
      ❌ ${escapeHTML(error.message)}
      </div>`;

    return;
  }

  restaurants=data||[];

  renderRestaurants();

  updateStats();
}


/* =====================================================
   SEARCH + RENDER
===================================================== */

function renderRestaurants(){

  const box=
    document.getElementById(
      "restaurantList"
    );

  const search=
    (document.getElementById("search")
    .value||"")
    .toLowerCase()
    .trim();

  let list=
    restaurants.filter(r=>{

      if(!search)return true;

      return (
        String(r.name||"")
          .toLowerCase()
          .includes(search)
        ||
        String(r.owner_name||"")
          .toLowerCase()
          .includes(search)
        ||
        String(r.phone||"")
          .toLowerCase()
          .includes(search)
      );

    });

  if(!list.length){

    box.innerHTML=
      `<div class="empty">
       कोई restaurant नहीं मिला।
       </div>`;

    return;
  }

  box.innerHTML=
    list.map(r=>{

      const isActive=
        r.is_active===true;

      const qrActive=
        r.customer_qr_active===true;

      const sub=
        r.subscription_status||"pending";

      const end=
        r.subscription_end
        ?new Date(
          r.subscription_end
        ).toLocaleDateString("en-IN")
        :"Not active";

      const ownerURL=
        BASE_URL+
        "/owner.html?token="+
        encodeURIComponent(
          r.owner_qr_token||""
        );

      const customerURL=
        BASE_URL+
        "/customer.html?token="+
        encodeURIComponent(
          r.customer_qr_token||""
        );

      return `

      <div class="restaurant">

        <div class="head">

          <div>

            <h3>
              ${escapeHTML(r.name)}
            </h3>

            <div class="muted">
              👤 ${escapeHTML(
                r.owner_name||"Not added"
              )}
            </div>

            <div class="muted">
              📞 ${escapeHTML(
                r.phone||"Not added"
              )}
            </div>

          </div>

          <span class="badge ${
            isActive
            ?"active"
            :"blocked"
          }">

            ${
              isActive
              ?"🟢 Active"
              :"🔴 Blocked"
            }

          </span>

        </div>


        <div class="info">

          <div>
            Subscription
            <strong>
              ${escapeHTML(sub)}
            </strong>
          </div>

          <div>
            Price
            <strong>
              ₹${Number(
                r.monthly_price||199
              )}/Month
            </strong>
          </div>

          <div>
            Start
            <strong>
              ${
                r.subscription_start
                ?new Date(
                  r.subscription_start
                ).toLocaleDateString("en-IN")
                :"Not active"
              }
            </strong>
          </div>

          <div>
            Valid Till
            <strong>${end}</strong>
          </div>

        </div>


        <!-- QR -->

        <div class="qrgrid">

          <div class="qrbox">

            <h4>🔐 Owner QR</h4>

            <div
              class="qr"
              id="owner-${r.id}">
            </div>

            <div class="qrbuttons">

              <button onclick="
                downloadQR(
                  '${safe(r.id)}',
                  'owner',
                  '${safe(r.name)}'
                )
              ">
                📥 Download
              </button>

              <button onclick="
                printQR(
                  '${safe(r.id)}',
                  'owner',
                  '${safe(r.name)}'
                )
              ">
                🖨️ Print
              </button>

            </div>

          </div>


          <div class="qrbox">

            <h4>📱 Customer QR</h4>

            <div
              class="qr"
              id="customer-${r.id}">
            </div>

            <div class="qrbuttons">

              <button onclick="
                downloadQR(
                  '${safe(r.id)}',
                  'customer',
                  '${safe(r.name)}'
                )
              ">
                📥 Download
              </button>

              <button onclick="
                printQR(
                  '${safe(r.id)}',
                  'customer',
                  '${safe(r.name)}'
                )
              ">
                🖨️ Print
              </button>

            </div>

          </div>

        </div>


        <!-- ACTIONS -->

        <div class="actions">

          ${
            isActive

            ?`

            <button
              class="action red"
              onclick="
                toggleRestaurant(
                  '${safe(r.id)}',
                  false
                )
              ">
              🚫 Block Restaurant
            </button>

            `

            :`

            <button
              class="action green"
              onclick="
                toggleRestaurant(
                  '${safe(r.id)}',
                  true
                )
              ">
              ✅ Activate Restaurant
            </button>

            `
          }


          ${
            qrActive

            ?`

            <button
              class="action orange"
              onclick="
                toggleCustomerQR(
                  '${safe(r.id)}',
                  false
                )
              ">
              📱 Customer QR OFF
            </button>

            `

            :`

            <button
              class="action blue"
              onclick="
                toggleCustomerQR(
                  '${safe(r.id)}',
                  true
                )
              ">
              📱 Customer QR ON
            </button>

            `
          }


          <button
            class="action green"
            onclick="
              activateSubscription(
                '${safe(r.id)}'
              )
            ">
            💰 Activate ₹199
          </button>


          <button
            class="action"
            onclick="
              showDetails(
                '${safe(r.id)}'
              )
            ">
            ℹ️ Details
          </button>

        </div>

      </div>

      `;

    }).join("");


  /* CREATE QR */

  list.forEach(r=>{

    const ownerBox=
      document.getElementById(
        "owner-"+r.id
      );

    const customerBox=
      document.getElementById(
        "customer-"+r.id
      );

    if(ownerBox){

      ownerBox.innerHTML="";

      new QRCode(
        ownerBox,
        {
          text:
            BASE_URL+
            "/owner.html?token="+
            encodeURIComponent(
              r.owner_qr_token||""
            ),
          width:180,
          height:180
        }
      );
    }

    if(customerBox){

      customerBox.innerHTML="";

      new QRCode(
        customerBox,
        {
          text:
            BASE_URL+
            "/customer.html?token="+
            encodeURIComponent(
              r.customer_qr_token||""
            ),
          width:180,
          height:180
        }
      );
    }

  });

}


/* =====================================================
   SAFE
===================================================== */

function safe(v){

  return String(v??"")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");
}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

  document.getElementById("total")
    .textContent=restaurants.length;

  document.getElementById("active")
    .textContent=
      restaurants.filter(
        r=>r.is_active===true
      ).length;

  document.getElementById("blocked")
    .textContent=
      restaurants.filter(
        r=>r.is_active===false
      ).length;

  document.getElementById("pendingRecharge")
    .textContent=
      rechargeRequests.filter(
        r=>r.status==="pending"
      ).length;
}


/* =====================================================
   LOAD RECHARGE REQUESTS
===================================================== */

async function loadRechargeRequests(){

  const box=
    document.getElementById(
      "rechargeList"
    );

  try{

    const {data,error}=
      await db
      .from("recharge_requests")
      .select("*")
      .order(
        "created_at",
        {ascending:false}
      );

    if(error)throw error;

    rechargeRequests=data||[];

    updateStats();

    if(!rechargeRequests.length){

      box.innerHTML=
        `<div class="empty">
        अभी कोई recharge request नहीं है।
        </div>`;

      return;
    }

    const restaurantIds=
      rechargeRequests
      .map(x=>x.restaurant_id)
      .filter(Boolean);

    let map={};

    if(restaurantIds.length){

      const {data:rows}=
        await db
        .from("restaurants")
        .select("id,name,owner_name,phone")
        .in(
          "id",
          restaurantIds
        );

      (rows||[]).forEach(
        r=>map[r.id]=r
      );
    }

    box.innerHTML=
      rechargeRequests.map(req=>{

        const r=
          map[req.restaurant_id]||{};

        const pending=
          req.status==="pending";

        return `

        <div class="recharge">

          <h3>
            🏪 ${escapeHTML(
              r.name||"Restaurant"
            )}
          </h3>

          <div class="muted">
            👤 ${escapeHTML(
              r.owner_name||"Owner"
            )}
          </div>

          <div class="muted">
            📞 ${escapeHTML(
              r.phone||""
            )}
          </div>

          <p>
            💰 Amount:
            <strong>
              ₹${Number(
                req.amount||199
              )}
            </strong>
          </p>

          <p>
            Status:
            <strong>
              ${escapeHTML(
                req.status||"pending"
              )}
            </strong>
  </p>
